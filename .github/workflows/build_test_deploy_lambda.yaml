name: Test, Build e Publish video-slice core

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'src/core/**'
      - 'tests/**'
      - 'pyproject.toml'

  pull_request:
    branches:
      - master
    paths:
      - 'src/core/**'
      - 'tests/**'
      - 'pyproject.toml'

env:
  PYTHON_VERSION: '3.12'

jobs:
  tests-and-coverage:
    name: Testes e Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache de dependências Python
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi

      - name: Executar testes com cobertura
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest tests/unit/ --cov=src/core --cov-report=xml:coverage.xml --cov-report=html --cov-report=term --junitxml=test-results.xml -v --cov-fail-under=80

      - name: Verificar cobertura mínima de 80%
        run: |
          echo "🎯 Verificando cobertura mínima de 80%..."
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(root.attrib['line-rate'])")
          COVERAGE_PERCENT=$(python -c "print(int(float($COVERAGE) * 100))")
          echo "📊 Cobertura atual: ${COVERAGE_PERCENT}%"
          
          if [ $COVERAGE_PERCENT -lt 80 ]; then
            echo "❌ Cobertura de ${COVERAGE_PERCENT}% está abaixo do mínimo de 80%"
            exit 1
          else
            echo "✅ Cobertura de ${COVERAGE_PERCENT}% atende o requisito mínimo de 80%"
          fi

      - name: Verificar e corrigir arquivo de cobertura para SonarCloud
        run: |
          if [ -f coverage.xml ]; then
            echo "✅ coverage.xml encontrado"
            echo "🔧 Corrigindo caminhos para SonarCloud..."
            sed -i '/<sources>/,/<\/sources>/d' coverage.xml
            sed -i 's|filename="|filename="src/core/|g' coverage.xml
            sed -i 's|filename="src/core/src/core/|filename="src/core/|g' coverage.xml
            echo "✅ Arquivo coverage.xml corrigido"
          else
            echo "❌ coverage.xml NÃO encontrado"
            exit 1
          fi

      - name: Upload de relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            test-results.xml

      - name: Análise do SonarCloud Quality Gate
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  create-release:
    name: Criar/Atualizar Release
    runs-on: ubuntu-latest
    needs: tests-and-coverage
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Obter versão do pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); data=tomllib.load(f); print(data['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versão detectada: $VERSION"

      - name: Preparar pacote para distribuição
        run: |
          echo "📦 Preparando pacote de distribuição..."
          python -m pip install --upgrade pip build
          python -m build
          
          echo "✅ Pacotes gerados:"
          ls -lh dist/

      - name: Verificar se release existe
        id: check_release
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          RELEASE_EXISTS=$(gh release view "v${VERSION}" --json id 2>/dev/null || echo "not_found")
          
          if [ "$RELEASE_EXISTS" = "not_found" ]; then
            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "🆕 Release v${VERSION} não existe, será criada"
          else
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "♻️ Release v${VERSION} já existe, será atualizada"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar nova release
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          
          # Gerar changelog automático
          echo "📝 Gerando changelog..."
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" -n 20)
          
          # Criar release
          gh release create "v${VERSION}" \
            --title "video-slice-core v${VERSION}" \
            --notes "## 🚀 Release v${VERSION}

          ### 📋 Mudanças
          $CHANGELOG

          ### 📦 Instalação
          \`\`\`bash
          pip install git+https://github.com/${{ github.repository }}.git@v${VERSION}
          \`\`\`

          ### 📊 Estatísticas
          - ✅ Testes: Passando
          - 📈 Cobertura: >= 80%
          - ✅ Quality Gate: Aprovado
          " \
            dist/*
          
          echo "✅ Release v${VERSION} criada com sucesso!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar release existente
        if: steps.check_release.outputs.release_exists == 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          
          echo "♻️ Atualizando release v${VERSION}..."
          
          # Remover assets antigos
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | while read asset; do
            echo "🗑️ Removendo asset antigo: $asset"
            gh release delete-asset "v${VERSION}" "$asset" --yes
          done
          
          # Gerar changelog atualizado
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" -n 20)
          
          # Atualizar release
          gh release edit "v${VERSION}" \
            --notes "## 🚀 Release v${VERSION} (Atualizada)

          ### 📋 Mudanças Recentes
          $CHANGELOG

          ### 📦 Instalação
          \`\`\`bash
          pip install git+https://github.com/${{ github.repository }}.git@v${VERSION}
          \`\`\`

          ### 📊 Estatísticas
          - ✅ Testes: Passando
          - 📈 Cobertura: >= 80%
          - ✅ Quality Gate: Aprovado

          **Última atualização:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          "
          
          # Fazer upload dos novos assets
          gh release upload "v${VERSION}" dist/* --clobber
          
          echo "✅ Release v${VERSION} atualizada com sucesso!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumo da Release
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "## 🎉 Release Concluída" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Versão: v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Link: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Instalação" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "pip install git+https://github.com/${{ github.repository }}.git@v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
